name: Deploy Mini App

on:
  push:
    branches: [main]
    paths:
      - 'Telegram.BotAPI.Examples/MiniApp/wwwroot/**'
      - '.github/workflows/mini-app-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Mini App
        uses: actions/upload-pages-artifact@v4
        with:
          path: Telegram.BotAPI.Examples/MiniApp/wwwroot

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
