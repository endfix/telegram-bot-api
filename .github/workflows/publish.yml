name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.317

      - name: Restore
        run: dotnet restore Telegram.BotAPI.sln

      - name: Build
        run: dotnet build Telegram.BotAPI.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Telegram.BotAPI.sln --configuration Release --no-build

      - name: Pack
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          dotnet pack Telegram.BotAPI/Telegram.BotAPI.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:PackageVersion="$VERSION"

      - name: NuGet login
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: endfix

      - name: Push package
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
