name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate README rendering
        # README.md ships inside the package; nuget.org escapes raw HTML and
        # cannot resolve repository-relative links. Fail before packing so a
        # published version never carries a broken gallery page.
        shell: pwsh
        run: ./scripts/check-readme.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.317

      - name: Resolve version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Stamp the package README with this release
        # README.md is packed into the package, so the install command on the
        # gallery page must name the tag being published. The repository copy
        # stays unpinned and installs the latest stable release.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'VERSION is not set.'
          }
          $path = Join-Path $PWD 'README.md'
          $pattern = 'dotnet add package Endfix\.Telegram\.BotAPI(?:\s+--version\s+[0-9A-Za-z.\-]+)?'
          $text = Get-Content -LiteralPath $path -Raw
          if ($text -notmatch $pattern) {
            throw 'README.md has no install command to stamp.'
          }
          $replacement = "dotnet add package Endfix.Telegram.BotAPI --version $version"
          $text = [regex]::new($pattern).Replace($text, $replacement, 1)
          if (-not $text.Contains($replacement)) {
            throw 'README.md was not stamped.'
          }
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

      - name: Restore
        run: dotnet restore Telegram.BotAPI.sln

      - name: Build
        # AssemblyVersion is pinned in the project file (2.0.0.0 for the 2.x
        # line); only the informational version tracks the release tag. Pack
        # runs with --no-build, so this is where the version has to reach the
        # compiled assembly.
        run: dotnet build Telegram.BotAPI.sln --configuration Release --no-restore -p:InformationalVersion="$VERSION"

      - name: Test
        run: dotnet test Telegram.BotAPI.sln --configuration Release --no-build

      - name: Pack
        shell: bash
        run: |
          dotnet pack Telegram.BotAPI/Telegram.BotAPI.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:PackageVersion="$VERSION"

      - name: Extract changelog release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $escapedVersion = [regex]::Escape($version)
          $match = [regex]::Match(
            $changelog,
            "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)")
          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain a release section for $version."
          }
          $notes = $match.Value.Trim() + [Environment]::NewLine
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'release-notes.md'),
            $notes,
            [Text.UTF8Encoding]::new($false))

      - name: NuGet login
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: endfix

      - name: Push package
        run: dotnet nuget push ./artifacts/*.nupkg --skip-duplicate --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
