name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.317

      - name: Restore
        run: dotnet restore Telegram.BotAPI.sln

      - name: Build
        run: dotnet build Telegram.BotAPI.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Telegram.BotAPI.sln --configuration Release --no-build

      - name: Pack
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          dotnet pack Telegram.BotAPI/Telegram.BotAPI.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:PackageVersion="$VERSION"

      - name: Extract changelog release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $escapedVersion = [regex]::Escape($version)
          $match = [regex]::Match(
            $changelog,
            "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)")
          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain a release section for $version."
          }
          $notes = $match.Value.Trim() + [Environment]::NewLine
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'release-notes.md'),
            $notes,
            [Text.UTF8Encoding]::new($false))

      - name: NuGet login
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: endfix

      - name: Push package
        run: dotnet nuget push ./artifacts/*.nupkg --skip-duplicate --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
